---
# OWASP CI/CD Top 10: workflow_call only, read-only token,
# pinned action and checksum, --redact, timeout, no artifact upload.
name: Gitleaks

on:
  workflow_call:
    inputs:
      config:
        description: >-
          Path to the Gitleaks config, relative to the caller repository. When
          empty, .github/config/.gitleaks.toml is used if it exists; otherwise
          Gitleaks looks for .gitleaks.toml at the repository root and then
          falls back to its default rules
        required: false
        type: string
        default: ""

permissions: {}

concurrency:
  group: gitleaks-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Scan
      uses: lpsm-dev/reusable-workflows/actions/gitleaks-scan@448df7be7d80aafadc6e0db77bc577c031cd0bca
      with:
        config: ${{ inputs.config }}
