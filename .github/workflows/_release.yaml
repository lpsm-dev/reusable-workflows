---
name: Manual - Release

on:
  workflow_dispatch:

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Setup node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
      with:
        node-version: "24.22.0"
    - name: Install dependencies
      # package-lock.json pins the transitive dependencies too (CICD-SEC-3).
      working-directory: .github/config/release
      run: npm ci --ignore-scripts
    - name: Release
      # semantic-release reads .releaserc.json and resolves its plugins from
      # the working directory, so it runs next to its lockfile.
      working-directory: .github/config/release
      run: ./node_modules/.bin/semantic-release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
