---
name: Manual - Release

on:
  workflow_dispatch:

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Setup node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
      with:
        node-version: "24.22.0"
    - name: Copy rules
      run: |
        cp .github/config/.releaserc.json .
    - name: Install dependencies
      # package-lock.json pins the transitive dependencies too (CICD-SEC-3).
      run: npm ci --ignore-scripts --prefix .github/config/release
    - name: Release
      run: .github/config/release/node_modules/.bin/semantic-release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
