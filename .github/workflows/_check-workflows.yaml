---
name: Common - Check Actions + Workflows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  action-lint:
    name: Action Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Run actionlint
      uses: ./actions/actionlint-check  # zizmor: ignore[self-repository]
  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Run yamllint
      uses: ./actions/yamllint-check  # zizmor: ignore[self-repository]
      with:
        config: .github/config/.yamllint.yaml
  zizmor:
    name: Zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Run zizmor
      uses: ./actions/zizmor-audit  # zizmor: ignore[self-repository]
