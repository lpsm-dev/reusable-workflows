---
name: Common - Check Actions + Workflows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  action-lint:
    name: Action Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Install actionlint
      run: |
        set -euo pipefail
        version="1.7.12"
        archive="actionlint_${version}_linux_amd64.tar.gz"
        url="https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
        checksum="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        work="$(mktemp -d)"
        curl -fsSL -o "${work}/${archive}" "$url"
        printf '%s  %s\n' "$checksum" "$archive" | (cd "$work" && sha256sum -c)
        tar -xzf "${work}/${archive}" -C "$work" actionlint
        sudo install -m 0755 "${work}/actionlint" /usr/local/bin/actionlint
        rm -rf "$work"
        actionlint -version
    - name: Run actionlint
      run: actionlint -color
  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Run yamllint
      run: |
        yamllint --version
        yamllint --strict --format github -c .github/config/.yamllint.yaml .
  zizmor:
    name: Zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Install zizmor
      run: |
        set -euo pipefail
        version="1.31.1"
        archive="zizmor-x86_64-unknown-linux-gnu.tar.gz"
        url="https://github.com/zizmorcore/zizmor/releases/download/v${version}/${archive}"
        checksum="d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99"
        work="$(mktemp -d)"
        curl -fsSL -o "${work}/${archive}" "$url"
        printf '%s  %s\n' "$checksum" "$archive" | (cd "$work" && sha256sum -c)
        tar -xzf "${work}/${archive}" -C "$work" zizmor
        sudo install -m 0755 "${work}/zizmor" /usr/local/bin/zizmor
        rm -rf "$work"
        zizmor --version
    - name: Run zizmor
      # Audits the workflows and the composite actions under actions/.
      # --offline keeps the job free of tokens and network calls.
      run: zizmor --offline --format github .
