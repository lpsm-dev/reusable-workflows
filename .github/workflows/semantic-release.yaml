---
name: Semantic Release

on:
  workflow_call:
    inputs:
      release-directory:
        description: Directory with package.json, package-lock.json and .releaserc.json
        required: false
        type: string
        default: .github/config/release
      release-branch:
        description: Branch permitted to create tags and GitHub releases
        required: false
        type: string
        default: main
      dry-run:
        description: Analyze and verify a release without publishing it
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  release:
    name: Release
    if: ${{ github.ref == format('refs/heads/{0}', inputs.release-branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Release
      uses: lpsm-dev/reusable-workflows/actions/semantic-release-run@1df18b0a7a4114dd2cd3f2473b3e448513fc5ddd
      with:
        release-directory: ${{ inputs.release-directory }}
        release-branch: ${{ inputs.release-branch }}
        dry-run: ${{ inputs.dry-run }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
