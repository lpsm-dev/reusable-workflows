---
name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    uses: ./.github/workflows/gitleaks.yaml
    with:
      # The AzSK example doubles as this repository's ruleset, so CI fails if
      # a Gitleaks upgrade stops it from loading.
      config: docs/workflows/gitleaks/azsk.toml
