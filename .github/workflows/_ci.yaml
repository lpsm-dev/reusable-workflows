---
name: CI

on:
  pull_request:
  push:

permissions: {}

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    permissions:
      contents: read
    # ADR 005 keeps the relative path instead of the $/ syntax.
    uses: ./.github/workflows/gitleaks.yaml  # zizmor: ignore[self-repository]
    with:
      # The AzSK example doubles as this repository's ruleset, so CI fails if
      # a Gitleaks upgrade stops it from loading.
      config: docs/handbooks/gitleaks/azsk.toml
