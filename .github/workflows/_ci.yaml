---
name: CI

on:
  pull_request:
  push:

permissions: {}

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    permissions:
      contents: read
    # ADR 005 keeps the relative path instead of the $/ syntax.
    uses: ./.github/workflows/gitleaks.yaml  # zizmor: ignore[self-repository]
    # No config input: the workflow picks up .github/config/.gitleaks.toml,
    # the AzSK ruleset, so CI also exercises the default lookup and fails if
    # a Gitleaks upgrade stops the ruleset from loading.
