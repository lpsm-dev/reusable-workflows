---
version: "3"

vars:
  ACTION_DOCS_VERSION: 2.5.1
  DIR_GITHUB_CUSTOM_ACTIONS: "{{ .ROOT_DIR }}/actions"
  REPOSITORY: lpsm-dev/reusable-workflows

tasks:
  action:docs:
    desc: Generating the README.md of each composite action from its action.yaml
    preconditions:
    - sh: which npx
      msg: npx {{ .PATH_ERROR }}
    cmds:
    - |
      for file in {{ .DIR_GITHUB_CUSTOM_ACTIONS }}/*/action.yaml; do
        dir="$(dirname "$file")"
        name="$(basename "$dir")"
        if ! grep -q "action-docs-all" "$dir/README.md" 2>/dev/null; then
          marker="<!-- action-docs-all source=\"action.yaml\" project=\"{{ .REPOSITORY }}/actions/$name\" version=\"<sha-completo>\" -->"
          printf '%s\n\n%s\n\n%s\n%s\n\n%s\n' "<!-- BEGIN_DOCS -->" "[◀ Voltar](../README.md)" "$marker" "$marker" "<!-- END_DOCS -->" > "$dir/README.md"
        fi
        echo "Running action-docs in $dir"
        (cd "$dir" && npx --yes action-docs@{{ .ACTION_DOCS_VERSION }} --no-banner --line-breaks=LF --toc-level=1 --include-name-header --source=action.yaml --update-readme=README.md)
      done

  action:lint:
    desc: Linting Custom Actions and Reusable Workflows
    preconditions:
    - sh: which actionlint
      msg: actionlint {{ .PATH_ERROR }}
    cmds:
    - actionlint
