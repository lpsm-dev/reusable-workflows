---
name: Zizmor audit
description: Audit GitHub Actions workflows and composite actions with pinned zizmor

runs:
  using: composite
  steps:
  - name: Install zizmor
    shell: bash
    run: |
      bash "$GITHUB_ACTION_PATH/../_lib/install-verified.sh" \
        "https://github.com/zizmorcore/zizmor/releases/download/v1.31.1/zizmor-x86_64-unknown-linux-gnu.tar.gz" \
        "d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99" \
        tar.gz zizmor "$RUNNER_TEMP/zizmor"
  - name: Audit workflows and actions
    shell: bash
    run: bash "$GITHUB_ACTION_PATH/run.sh"
